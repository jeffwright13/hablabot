name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Runs the full suite and enforces the coverage minimums in
      # vitest.config.js; a drop below any of them fails the build.
      - name: Run tests with coverage
        run: npm run test:coverage

      # HablaBot ships no npm packages (the app is plain <script> files), so
      # only runtime dependencies could reach users, and an advisory there
      # fails the build. Dev tooling (Vitest, Vite) is audited too but only
      # reported, so an advisory with no non-breaking fix can't block every
      # PR. Same policy as ~/coding/dreaming-tools; see docs/DECISIONS.md.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev

      # Non-blocking, but not silent: a failing audit adds a warning
      # annotation to the checks summary instead of only appearing in the log.
      - name: Report dev dependency advisories
        run: npm audit || echo "::warning title=npm audit::Dev-dependency advisories found (non-blocking; see this step's log and docs/TODO.md)"

  # The real app in Chromium against a fake OpenAI (tests/browser/fake-openai.js).
  # Free and offline. The live project never runs here: it exists only with
  # HABLABOT_LIVE=1, and CI has no key. The synthetic-microphone spec skips
  # off macOS.
  browser:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:browser

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
